<style>
:root{color-scheme:dark;--bg:#050505;--bg2:#0d0d0d;--bg3:#151515;--panel:rgba(14,14,14,.96);--border:rgba(242,217,78,.12);--border-focus:#f2d94e;--accent:#f2d94e;--accent-glow:rgba(242,217,78,.25);--gold:#f2d94e;--green:#00f070;--red:#f03030;--text:#ececec;--text-muted:#8a8a80;--r:8px;--font-display:'Rajdhani',sans-serif;--font-mono:'JetBrains Mono',monospace}

body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;min-height:100vh;overflow-x:hidden}

.f{margin-bottom:.9rem}.f label{display:block;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:.35rem;font-family:var(--font-display)}
